<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>지아네 냥전트</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <span class="brand-mark">◆</span>
          <span class="brand-title">지아네 냥전트</span>
        </div>
        <div class="session-name" id="session-name" hidden></div>
        <div class="status" id="status">
          <span class="status-dot" id="status-dot"></span>
          <span class="status-text" id="status-text">—</span>
          <span class="status-session" id="status-session"></span>
        </div>
        <button type="button" class="diary-open" id="diary-open" title="냥전트들이 한 일">📒 업무일지</button>
        <button type="button" class="diary-open" id="usage-open" title="AI 도구별 크레딧·토큰 사용량 (일별·월별)">🐟 간식비 <span class="usage-open-chip" id="usage-chip">Kiro —</span></button>
        <div class="power-toggle" id="power-toggle" role="group" aria-label="3D 화면 전원">
          <span class="power-label">3D</span>
          <button type="button" data-power="auto" title="일할 때 60fps · 쉴 때 20fps · 안 볼 때 10fps">자동</button>
          <button type="button" data-power="on" title="항상 60fps · 그림자/AO 전부">켜기</button>
          <button type="button" data-power="eco" title="30fps · AO 끔 · 저해상도 — 발열 줄이기">절전</button>
          <button type="button" data-power="off" title="3D 정지 — 로그와 알림은 계속 동작">끄기</button>
        </div>
        <div class="live-badge" id="live-badge" data-live="false">
          <span class="live-dot"></span><span>LIVE</span>
        </div>
      </header>

      <aside id="floor-guide" class="panel">
        <div class="panel-head">
          <h2>층별 안내</h2>
          <span class="panel-sub">FLOOR GUIDE</span>
          <button id="guide-toggle" class="panel-toggle" aria-label="층별 안내 접기">«</button>
        </div>
        <div class="alert-settings">
          <label class="follow-toggle" title="카메라가 일하는 고양이를 따라가요"><input type="checkbox" id="auto-follow" checked /><span>🎥 자동 따라가기</span></label>
          <label class="follow-toggle" title="결재 대기를 데스크톱 알림으로 받아요"><input type="checkbox" id="notify-desktop" /><span>🔔 데스크톱 알림</span></label>
          <label class="follow-toggle" title="새 결재 대기가 생기면 딩동 소리를 내요"><input type="checkbox" id="notify-sound" checked /><span>🔊 소리</span></label>
          <label class="follow-toggle" title="Claude Code·Codex는 권한 창이 기록에 남지 않아요. 결과 없이 멈춘 도구 호출을 승인 대기로 추정해요"><input type="checkbox" id="notify-inferred" checked /><span>🕵️ 권한 대기 추정</span></label>
        </div>
        <ul id="floor-list" class="floor-list"></ul>
      </aside>

      <main id="stage-wrap">
        <canvas id="office"></canvas>
        <div id="power-overlay" class="power-overlay" hidden>
          <div class="power-card">
            <div class="power-title">3D 화면이 꺼져 있어요</div>
            <div class="power-sub">맥북 발열을 줄이려고 렌더링을 멈췄어요. 활동 로그와 결재 알림은 계속 와요.</div>
            <button type="button" id="power-resume">다시 켜기</button>
          </div>
        </div>
        <div id="diary" class="diary" hidden></div>
        <div id="usage" class="diary" hidden></div>
        <div id="room-labels"></div>
        <div id="legend" class="legend">
          <div class="legend-head">어디서 무엇을 하나 · ROOM GUIDE</div>
          <div class="legend-grid" id="legend-grid"></div>
        </div>
      </main>

      <aside id="activity" class="panel">
        <div class="panel-head">
          <h2>활동 로그</h2>
          <span class="panel-sub">ACTIVITY LOG</span>
        </div>
        <div class="activity-controls">
          <div class="chip-bar" id="chip-bar">
            <button class="chip chip-all active" data-chip="all">전체</button>
            <button class="chip" data-cat="read">읽기</button>
            <button class="chip" data-cat="write">작성</button>
            <button class="chip" data-cat="run">실행</button>
            <button class="chip" data-cat="test">테스트</button>
            <button class="chip" data-cat="web">웹</button>
            <button class="chip" data-cat="plan">계획</button>
            <button class="chip" data-cat="talk">대화</button>
          </div>
          <input type="search" class="activity-search" id="activity-search" placeholder="검색" />
        </div>
        <ul id="activity-list" class="activity-list"></ul>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
